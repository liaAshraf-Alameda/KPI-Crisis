<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>KPI Crisis Room: The Missing Consent Forms — Neon Edition (Individual)</title>

	<!-- Fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

	<style>
		:root{
			--bg-dark: #06060a;
			--panel-bg: rgba(10,10,14,0.6);
			--glass: rgba(255,255,255,0.03);
			--neon-cyan: #00fff0;
			--neon-pink: #ff00d4;
			--neon-green: #39ff14;
			--neon-blue: #66f0ff;
			--neon-yellow: #ffd166;
			--muted: #cbd5e1;
			--glow: 0 0 18px rgba(0,255,240,0.18), 0 0 36px rgba(255,0,212,0.08);
			--card-glow: 0 6px 30px rgba(0,255,240,0.06), inset 0 1px 0 rgba(255,255,255,0.02);
			--glass-border: rgba(255,255,255,0.06);
		}

		/* Animated neon background */
		body {
			background: radial-gradient(ellipse at 10% 20%, rgba(0,255,240,0.04) 0%, transparent 15%),
						radial-gradient(ellipse at 90% 80%, rgba(255,0,212,0.035) 0%, transparent 12%),
						linear-gradient(180deg, var(--bg-dark), #0b0b10 60%);
			min-height: 100vh;
			margin: 0;
			padding: 28px;
			font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
			color: var(--muted);
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
		}

		/* Container */
		#story {
			max-width: 980px;
			margin: 0 auto;
			background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
			border-radius: 14px;
			padding: 28px;
			box-shadow: 0 8px 40px rgba(0,0,0,0.7), var(--card-glow);
			backdrop-filter: blur(6px) saturate(120%);
			border: 1px solid var(--glass-border);
			overflow: hidden;
		}

		.passage { line-height: 1.8; display: none; }
		.passage.active { display: block; animation: fadeIn 0.25s ease both; }

		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(6px); }
			to { opacity: 1; transform: translateY(0); }
		}

		h1, h2 {
			color: var(--neon-pink);
			font-family: 'Orbitron', sans-serif;
			letter-spacing: 0.6px;
			margin: 10px 0 18px 0;
			text-shadow: 0 0 10px rgba(255,0,212,0.12), 0 0 30px rgba(0,255,240,0.04);
			border-bottom: 2px dashed rgba(255,255,255,0.02);
			padding-bottom: 8px;
		}

		h3 { color: var(--neon-cyan); margin-top: 18px; font-family: 'Orbitron', sans-serif; }

		/* Player info panel: neon glass */
		.player-info {
			background: linear-gradient(135deg, rgba(0,0,0,0.45), rgba(255,255,255,0.01));
			border: 1px solid rgba(0,255,240,0.08);
			color: var(--neon-cyan);
			padding: 16px;
			border-radius: 10px;
			margin-bottom: 18px;
			box-shadow: 0 8px 30px rgba(0,0,0,0.6);
		}

		.player-info h3 {
			color: var(--neon-cyan);
			margin-top: 0;
			border: none;
		}

		.player-details {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
			margin-top: 8px;
		}

		.player-detail-item {
			background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
			padding: 10px;
			border-radius: 8px;
			border: 1px solid rgba(255,255,255,0.02);
			box-shadow: 0 4px 18px rgba(0,0,0,0.6);
		}

		.player-detail-label {
			font-size: 12px;
			font-weight: 600;
			text-transform: uppercase;
			opacity: 0.7;
			color: rgba(255,255,255,0.6);
		}

		.player-detail-value {
			font-size: 18px;
			font-weight: 700;
			margin-top: 6px;
			color: var(--neon-yellow);
			text-shadow: 0 0 8px rgba(255,209,102,0.12);
		}

		/* Countdown neon */
		#countdown {
			font-size: 20px;
			font-weight: 700;
			color: var(--neon-pink);
			background: linear-gradient(90deg, rgba(255,0,212,0.03), rgba(0,255,240,0.02));
			border-left: 4px solid var(--neon-pink);
			border-radius: 8px;
			padding: 12px;
			text-align: center;
			box-shadow: 0 6px 24px rgba(255,0,212,0.04), 0 0 20px rgba(0,255,240,0.02);
		}

		#countdown.alarm {
			animation: alarmPulseNeon 0.6s infinite;
		}

		@keyframes alarmPulseNeon {
			0%,100% { box-shadow: 0 0 8px rgba(255,0,212,0.06), 0 0 28px rgba(255,0,212,0.08); transform: scale(1); }
			50% { box-shadow: 0 0 20px rgba(255,0,212,0.14), 0 0 48px rgba(255,0,212,0.18); transform: scale(1.02); }
		}

		.chart-container {
			position: relative;
			width: 100%;
			max-width: 680px;
			margin: 20px auto;
			background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
			padding: 12px;
			border-radius: 10px;
			border: 1px solid rgba(0,255,240,0.04);
			box-shadow: var(--glow);
		}

		.progress-container {
			width: 100%;
			height: 36px;
			background-color: rgba(255,255,255,0.02);
			border-radius: 20px;
			overflow: hidden;
			margin: 15px 0;
			border: 1px solid rgba(255,255,255,0.02);
		}

		.progress-bar {
			height: 100%;
			background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
			width: 0%;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #001;
			font-weight: 800;
			transition: width 0.35s cubic-bezier(.2,.9,.3,1);
			text-shadow: 0 0 8px rgba(0,255,240,0.4);
		}

		form {
			margin: 20px 0;
			padding: 14px;
			background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
			border-radius: 10px;
			border: 1px solid rgba(255,255,255,0.02);
		}

		label {
			display: block;
			margin: 12px 0;
			padding: 12px;
			background: rgba(0,0,0,0.35);
			border: 1px solid rgba(255,255,255,0.02);
			border-radius: 8px;
			cursor: pointer;
			transition: all 0.18s ease;
			color: var(--muted);
		}

		label:hover {
			transform: translateY(-4px);
			box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 28px rgba(0,255,240,0.06);
			border-color: rgba(0,255,240,0.12);
		}

		label input[type="checkbox"], label input[type="radio"] {
			margin-right: 12px;
			transform: scale(1.1);
			filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
		}

		button {
			background: linear-gradient(135deg, rgba(0,255,240,0.14), rgba(255,0,212,0.12));
			color: var(--neon-cyan);
			border: 1px solid rgba(0,255,240,0.12);
			padding: 10px 18px;
			font-size: 14px;
			font-weight: 700;
			border-radius: 10px;
			cursor: pointer;
			transition: transform 0.14s ease, box-shadow 0.14s ease;
			text-shadow: 0 0 12px rgba(0,255,240,0.08);
			box-shadow: 0 6px 18px rgba(0,0,0,0.6);
			margin: 8px 6px;
		}

		button:hover:not(:disabled) {
			transform: translateY(-4px) scale(1.02);
			box-shadow: 0 10px 36px rgba(0,255,240,0.08), 0 0 28px rgba(255,0,212,0.04);
		}

		button:disabled {
			opacity: 0.45;
			cursor: not-allowed;
			filter: grayscale(0.35);
		}

		.results-box {
			background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.008));
			border-left: 4px solid rgba(0,255,240,0.08);
			padding: 15px;
			margin: 15px 0;
			border-radius: 8px;
			color: var(--muted);
		}

		.cause-block {
			margin: 10px 0;
			padding: 12px;
			border-radius: 8px;
			background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(255,255,255,0.01));
			border-left: 4px solid rgba(102,126,234,0.06);
			box-shadow: 0 6px 20px rgba(0,0,0,0.6);
		}

		.score {
			font-weight: 800;
			font-size: 18px;
			color: var(--neon-pink);
			margin-top: 12px;
			padding: 10px;
			background: rgba(255,0,212,0.03);
			border-radius: 6px;
			border: 1px solid rgba(255,0,212,0.06);
			text-shadow: 0 0 8px rgba(255,0,212,0.06);
		}

		.tool-card {
			background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
			border: 1px solid rgba(255,255,255,0.02);
			padding: 12px;
			margin: 10px 0;
			border-radius: 10px;
			transition: all 0.18s ease;
			box-shadow: 0 8px 24px rgba(0,0,0,0.6);
		}

		.tool-card:hover {
			border-color: rgba(0,255,240,0.12);
			box-shadow: 0 12px 40px rgba(0,255,240,0.04), 0 8px 24px rgba(0,0,0,0.6);
		}

		.data-card {
			background: linear-gradient(180deg, rgba(10,10,14,0.72), rgba(255,255,255,0.01));
			border: 1px solid rgba(0,255,240,0.05);
			padding: 18px;
			margin: 15px 0;
			border-radius: 10px;
			box-shadow: 0 10px 36px rgba(0,0,0,0.6);
		}

		.success-message {
			background: linear-gradient(90deg, rgba(57,255,20,0.03), rgba(0,255,240,0.01));
			border: 1px solid rgba(57,255,20,0.08);
			color: var(--neon-green);
			padding: 12px;
			border-radius: 8px;
			margin: 12px 0;
			font-weight: 700;
		}

		.failure-message {
			background: linear-gradient(90deg, rgba(255,201,102,0.02), rgba(255,0,212,0.01));
			border: 1px solid rgba(255,201,102,0.08);
			color: var(--neon-yellow);
			padding: 12px;
			border-radius: 8px;
			margin: 12px 0;
			font-weight: 700;
		}

		.nav-links {
			margin-top: 18px;
			padding-top: 18px;
			border-top: 1px dashed rgba(255,255,255,0.02);
		}

		.emoji { font-size: 1.45em; margin-right: 8px; }

		/* Registration */
		.registration-form {
			background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
			padding: 18px;
			border-radius: 10px;
			margin: 18px 0;
			border: 1px solid rgba(255,255,255,0.02);
		}

		.form-group { margin: 10px 0; }

		.form-group input, .form-group select {
			width: 100%;
			padding: 10px;
			border: 1px solid rgba(255,255,255,0.03);
			border-radius: 8px;
			font-size: 14px;
			background: rgba(0,0,0,0.45);
			color: var(--muted);
		}

		.form-group input:focus, .form-group select:focus {
			outline: none;
			border-color: rgba(0,255,240,0.12);
			box-shadow: 0 8px 30px rgba(0,255,240,0.04);
			background: rgba(0,0,0,0.6);
		}

		.player-info-list {
			background: linear-gradient(180deg, rgba(0,0,0,0.36), rgba(255,255,255,0.01));
			border: 1px solid rgba(0,255,240,0.05);
			padding: 12px;
			border-radius: 10px;
			margin: 12px 0;
			color: var(--muted);
		}

		.leaderboard {
			margin-top: 20px;
			border: 1px solid rgba(255,255,255,0.02);
			border-radius: 8px;
			padding: 12px;
			background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
			color: var(--muted);
		}

		.leaderboard h4 { margin: 0 0 10px 0; color: var(--neon-cyan); }

		.leaderboard table {
			width: 100%;
			border-collapse: collapse;
		}

		.leaderboard th, .leaderboard td {
			padding: 8px;
			text-align: left;
			border-bottom: 1px solid rgba(255,255,255,0.02);
			font-size: 13px;
			color: var(--muted);
		}

		.leaderboard .small { font-size: 12px; color: rgba(255,255,255,0.45); }

		/* small helpers */
		.small { font-size: 13px; color: rgba(255,255,255,0.6); }
	</style>
</head>
<body>

<div id="story">
	<!-- All passages will be inserted here by JavaScript -->
</div>

<audio id="alarmSound" preload="auto">
	<source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBg==" type="audio/wav">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

<script>
// Game state (individual)
var gameState = {
	playerName: '',
	score: 0,
	weightedScore: 0,
	causeWeights: {},
	weightedMax: 0,
	tool: null,
	actionsSelected: [],
	actionsWeighted: 0,
	actionsMaxPossible: 0,
	actionsFactor: 0.5,
	finalKPI: null,
	currentPage: 'Registration'
};

var SCORE_MAX = 30;

var weightRatings = {
  "Staff shortage": 10,
  "Staff not trained": 9,
  "Consent form moved in EMR": 8,
  "New physicians joined": 7,
  "Poor supervision": 6,
  "Policy update not communicated": 5,
  "High patient turnover": 4,
  "Overloaded EMR system": 3,
  "Language barriers with patients": 2,
  "Medication shortage": 0,
  "Equipment malfunction": 0
};

var sortedWeights = Object.values(weightRatings).slice().sort(function(a,b){return b-a;});
var weightedMaxPossible = sortedWeights[0] + (sortedWeights[1] || 0) + (sortedWeights[2] || 0);

var toolImpacts = {
	'FOCUS-PDCA': 1.0,
	'DMAIC': 0.9,
	'Lean': 0.8
};

var KPI_BASELINE = 84;
var KPI_IDEAL = 96;

var timeLimits = {
	RootCauseHunt: 300,
	DataMarketplace: 300,
	ActionPlan: 300
};

// Actions for each tool (weights internal only)
var toolActions = {
	'FOCUS-PDCA': [
		{ id: 'rapidTraining', name: 'Run a rapid training session', desc: 'Short, focused training (15–20 minutes) demonstrating the consent workflow — immediate boost in staff knowledge.', weight: 9 },
		{ id: 'pilotChecklist', name: 'Pilot a new consent checklist', desc: 'Introduce a concise consent checklist and pilot it on one unit to test workflow improvements.', weight: 8 },
		{ id: 'dailyHuddle', name: 'Daily huddle for feedback', desc: 'Hold a short daily huddle to capture feedback and remove blockers quickly.', weight: 7 },
		{ id: 'miniAudit', name: 'Mini‑audit of 10 charts per day', desc: 'Perform rapid audits of 10 charts daily and provide immediate feedback to staff to monitor compliance.', weight: 8 }
	],
	'Lean': [
		{ id: 'removeRedundantClicks', name: 'Remove redundant EMR clicks', desc: 'Work with IT to remove unnecessary clicks and defaults so documentation is faster and less frustrating.', weight: 9 },
		{ id: 'standardizeWorkflow', name: 'Standardize consent workflow steps', desc: 'Create a simple, standardized step sequence for consent documentation to reduce variation across departments.', weight: 8 },
		{ id: 'reassignTasks', name: 'Reassign tasks to balance workload', desc: 'Adjust role assignments and task distribution to reduce bottlenecks from staff shortages.', weight: 7 },
		{ id: 'visualReminders', name: 'Visual reminders at patient intake', desc: 'Place clear visual cues and checklists at intake points to prompt staff to obtain consent.', weight: 6 }
	],
	'DMAIC': [
		{ id: 'rootCauseData', name: 'Conduct root cause analysis with data', desc: 'Use data to run a focused root cause analysis and identify hidden drivers of non‑compliance.', weight: 9 },
		{ id: 'retrainFromAudits', name: 'Retrain staff based on audit findings', desc: 'Deliver targeted retraining sessions addressing specific gaps discovered in audits.', weight: 8 },
		{ id: 'controlChart', name: 'Introduce control chart monitoring', desc: 'Implement SPC/control charts to monitor compliance trends and detect shifts early.', weight: 8 },
		{ id: 'correctivePlan', name: 'Develop corrective action plan with metrics', desc: 'Create a corrective action plan including metrics, owners and timelines to ensure accountability.', weight: 7 }
	]
};

// Passages (individual wording)
var passages = {
	'Registration': `
		<h2><span class="emoji">👤</span>Player Registration</h2>
		<p>Welcome to the KPI Crisis Room! Please enter your name to start:</p>
		
		<div class="registration-form">
			<div class="form-group">
				<label for="playerName"><strong>Player Name:</strong></label>
				<input type="text" id="playerName" placeholder="Enter your name (e.g., Alex Johnson)" required>
			</div>

			<button onclick="registerPlayer()">Start Mission →</button>
		</div>

		<div class="results-box">
			<p><strong>⏱️ Time per round:</strong></p>
			<ul>
				<li>Root Cause Hunt: 5 minute</li>
				<li>Data Marketplace Review: 5 minutes</li>
				<li>Action Plan Development: 5 minutes</li>
			</ul>
		</div>
	`,
	'Start': `
		<div class="player-info">
			<h3><span class="emoji">👤</span>Player Information</h3>
			<div class="player-details">
				<div class="player-detail-item">
					<div class="player-detail-label">Player</div>
					<div class="player-detail-value" id="displayPlayerName">-</div>
				</div>
				<div class="player-detail-item">
					<div class="player-detail-label">Mode</div>
					<div class="player-detail-value" id="displayPlayerMode">Individual</div>
				</div>
			</div>
		</div>

		<h2><span class="emoji">🚨</span>KPI Crisis Room: The Missing Consent Forms</h2>
		
		<p><strong>Target KPI:</strong> ≥95% informed consent documentation.</p>
		<p><strong>Current Status:</strong> CRITICAL ⚠️</p>
		<p>Performance is dropping rapidly. Patient safety and accreditation are at immediate risk.</p>
		
		<div class="chart-container">
			<canvas id="kpiChart"></canvas>
		</div>

		<div class="results-box">
			<h3>The Situation</h3>
			<p>Over the past 4 months, consent documentation has declined from 97% to 84%. This places the hospital out of compliance and risks:</p>
			<ul>
				<li>❌ Accreditation loss</li>
				<li>❌ Legal liability</li>
				<li>❌ Patient safety concerns</li>
				<li>❌ Regulatory penalties</li>
			</ul>
		</div>

		<h3>Your Mission</h3>
		<p>Investigate root causes, analyze data, select the right improvement methodology, and restore compliance to ≥95% before accreditation review fails.</p>

		<div class="nav-links">
			<button onclick="goToPage('RootCauseHunt')">Yes — Let's Fix This!</button>
			<button onclick="goToPage('GameOver')">No — I'm Not Ready</button>
		</div>
	`,
	'RootCauseHunt': `
		<div class="player-info">
			<h3><span class="emoji">👤</span>Player Information</h3>
			<div class="player-details">
				<div class="player-detail-item">
					<div class="player-detail-label">Player</div>
					<div class="player-detail-value" id="displayPlayerName2">-</div>
				</div>
				<div class="player-detail-item">
					<div class="player-detail-label">Mode</div>
					<div class="player-detail-value" id="displayPlayerMode2">Individual</div>
				</div>
			</div>
		</div>

		<h2><span class="emoji">🕵️</span>ROUND 1: ROOT CAUSE HUNT</h2>
		
		<div class="time-info">
			<strong>⏱️ Time Limit:</strong> 5 minute (300 seconds)
		</div>

		<p>Choose the <strong>3 most likely causes</strong> of the compliance failure:</p>
		<div id="countdown"></div>

		<form id="causeForm">
			<label>
				<input type="checkbox" name="cause" value="Staff shortage">
				<strong>Staff Shortage</strong> — High ratio of open shifts; multiple appointments rescheduled
			</label>
			<label>
				<input type="checkbox" name="cause" value="New physicians joined">
				<strong>New Physicians Joined</strong> — New hires unfamiliar with local workflows; higher error rates
			</label>
			<label>
				<input type="checkbox" name="cause" value="Consent form moved in EMR">
				<strong>Consent Form Moved in EMR</strong> — Consent workflow changed location in the EMR system
			</label>
			<label>
				<input type="checkbox" name="cause" value="Staff not trained">
				<strong>Staff Not Trained</strong> — Missing or incomplete training logs; staff report uncertainty
			</label>
			<label>
				<input type="checkbox" name="cause" value="Medication shortage">
				<strong>Medication Shortage</strong> — Pharmacy alerts for low stock; substitution rates increased
			</label>
			<label>
				<input type="checkbox" name="cause" value="Equipment malfunction">
				<strong>Equipment Malfunction</strong> — Increased maintenance tickets; several downtime incidents
			</label>
			<label>
				<input type="checkbox" name="cause" value="Poor supervision">
				<strong>Poor Supervision</strong> — Inconsistent oversight and spot-checking of documentation.
			</label>
			<label>
				<input type="checkbox" name="cause" value="Policy update not communicated">
				<strong>Policy Update Not Communicated</strong> — Changes not pushed to frontline staff.
			</label>
			<label>
				<input type="checkbox" name="cause" value="High patient turnover">
				<strong>High Patient Turnover</strong> — Busy shifts reduce documentation time.
			</label>
			<label>
				<input type="checkbox" name="cause" value="Overloaded EMR system">
				<strong>Overloaded EMR System</strong> — Slow or unresponsive EMR causes skipped steps.
			</label>
			<label>
				<input type="checkbox" name="cause" value="Language barriers with patients">
				<strong>Language Barriers With Patients</strong> — Consent conversations require interpreters, causing delays.

// Register player
function registerPlayer() {
	var playerName = $('#playerName').val().trim();

	if (!playerName) {
		alert('Please enter your name');
		return;
	}

	gameState.playerName = playerName;
	goToPage('Start');
}

// Navigation function
function goToPage(pageName) {
	gameState.currentPage = pageName;
	$('#story').html('<div class="passage active">' + passages[pageName] + '</div>');

	// Update player info displays (all displayPlayerNameN and displayPlayerModeN)
	$('[id^="displayPlayerName"]').text(gameState.playerName || '-');
	$('[id^="displayPlayerMode"]').text('Individual');

	// Special page behaviors
	if (pageName === 'Start') {
		renderKpiChart();
	}
	if (pageName === 'RootCauseHunt') {
		startCountdown('RootCauseHunt');
	}
	if (pageName === 'DataMarketplace') {
		renderProgressBar();
		startCountdown('DataMarketplace');
		renderDataLinks();
	}
	if (pageName === 'ChooseTool') {
		// nothing special yet
	}
	if (pageName === 'ActionPlan') {
		startCountdown('ActionPlan');
		renderActionPlan();
	}
	if (pageName === 'FinalRound') {
		renderFinalResults();
	}
	if (pageName === 'GameOver') {
		// show leaderboard in game over if needed
	}
}

// Countdown timer (simple, shared)
var countdownTimer = null;
var countdownRemaining = 0;
function startCountdown(section) {
	clearInterval(countdownTimer);
	countdownRemaining = timeLimits[section] || 300;
	$('#countdown').text(formatTime(countdownRemaining));
	countdownTimer = setInterval(function() {
		countdownRemaining--;
		$('#countdown').text(formatTime(countdownRemaining));
		if (countdownRemaining <= 10) {
			$('#countdown').addClass('alarm');
			document.getElementById('alarmSound').play();
		} else {
			$('#countdown').removeClass('alarm');
		}
		if (countdownRemaining <= 0) {
			clearInterval(countdownTimer);
			goToPage('GameOver');
		}
	}, 1000);
}
function formatTime(s) {
	var m = Math.floor(s/60);
	var sec = s % 60;
	return (m>0?m+':':'') + (sec<10? '0'+sec : sec);
}

// Submit causes
function submitCauses() {
	var selected = [];
	$('#causeForm input[name="cause"]:checked').each(function(){
		selected.push($(this).val());
	});
	if (selected.length !== 3) {
		alert('Please select exactly 3 causes.');
		return;
	}
	gameState.actionsSelected = [];
	// calculate a simple score based on weights
	var score = 0;
	selected.forEach(function(v){
		score += (weightRatings[v] || 0);
	});
	gameState.score = score;
	$('#results').show().html('<div class="success-message">Investigation complete — score: ' + score + '</div>');
	$('#continueBtn').show();
}

// Render Data Links (based on score)
function renderDataLinks() {
	var score = gameState.score || 0;
	var links = '';
	links += '<div class="tool-card"><strong>Audit Results</strong><br><button onclick="goToPage(\\'DataAudit\\')">Open Report</button></div>';
	if (score >= 20) {
		links += '<div class="tool-card"><strong>Physician Profiles</strong><br><button onclick="goToPage(\\'DataPhysicians\\')">Open Report</button></div>';
	}
	if (score >= 15) {
		links += '<div class="tool-card"><strong>EMR Change Log</strong><br><button onclick="goToPage(\\'DataEMR\\')">Open Report</button></div>';
	}
	links += '<div class="tool-card"><strong>Staff Feedback</strong><br><button onclick="goToPage(\\'DataFeedback\\')">Open Report</button></div>';
	$('#dataLinks').html(links);
	$('#scoreDisplay').text('Investigation Score: ' + (gameState.score || 0));
	// update progress bar
	var pct = Math.min(100, Math.round((gameState.score / (weightedMaxPossible || 1)) * 100));
	$('#progressBar').css('width', pct + '%').text(pct + '%');
}

// Render KPI chart on Start
function renderKpiChart() {
	var ctx = document.getElementById('kpiChart');
	if (!ctx) return;
	var chart = new Chart(ctx, {
		type: 'line',
		data: {
			labels: ['4 months ago','3 months ago','2 months ago','Now'],
			datasets: [{
				label: 'Consent Documentation %',
				data: [97,95,90,84],
				borderColor: 'rgba(102,240,255,0.9)',
				backgroundColor: 'rgba(0,255,240,0.06)',
				fill: true,
				tension: 0.2
			}]
		},
		options: {
			scales: {
				y: { min: 70, max: 100 }
			}
		}
	});
}

// Submit tool selection
function submitTool() {
	var selected = $('input[name="tool"]:checked').val();
	if (!selected) {
		alert('Please select an improvement tool.');
		return;
	}
	gameState.tool = selected;
	$('#toolContinueBtn').show();
	alert('Tool locked: ' + selected);
}

// Render action plan options based on tool
function renderActionPlan() {
	var tool = gameState.tool || 'FOCUS-PDCA';
	var actions = toolActions[tool] || [];
	var html = '';
	actions.forEach(function(a){
		html += '<label><input type="checkbox" name="action" value="'+a.id+'" data-weight="'+a.weight+'"><strong>'+a.name+'</strong><div class="small">'+a.desc+'</div></label>';
	});
	$('#actionsList').html(html);

	// Wire up selection limit
	$('#actionsList input[name="action"]').on('change', function(){
		var checked = $('#actionsList input[name="action"]:checked').length;
		$('#actionSelectionHint').text('Selected ' + checked + ' of 2 actions');
		if (checked === 2) {
			$('#lockActionsBtn').prop('disabled', false);
		} else {
			$('#lockActionsBtn').prop('disabled', true);
			$('#executePlanBtn').prop('disabled', true);
		}
	});
}

function submitActions() {
	var checked = $('#actionsList input[name="action"]:checked');
	if (checked.length !== 2) {
		alert('Please select exactly 2 actions.');
		return;
	}
	gameState.actionsSelected = [];
	var totalWeight = 0;
	checked.each(function(){
		gameState.actionsSelected.push($(this).val());
		totalWeight += parseInt($(this).data('weight') || 0, 10);
	});
	gameState.actionsWeighted = totalWeight;
	$('#lockActionsBtn').prop('disabled', true);
	$('#executePlanBtn').prop('disabled', false);
	alert('Actions locked.');
}

// Render final results
function renderFinalResults() {
	// simple model: final KPI = baseline + toolImpact*(actionsWeighted / maxPossible)*10
	var toolImpact = toolImpacts[gameState.tool] || 0.8;
	var maxActionWeight = 18; // approximate maximum two-action sum
	var actionFactor = (gameState.actionsWeighted || 0) / (maxActionWeight || 1);
	var improvement = Math.round(toolImpact * actionFactor * 12); // scale
	var finalKPI = Math.min(100, KPI_BASELINE + improvement);
	gameState.finalKPI = finalKPI;

	// show chart
	var ctx = document.getElementById('finalChart');
	if (ctx) {
		var chart = new Chart(ctx, {
			type: 'bar',
			data: {
				labels: ['Baseline','Post-Intervention'],
				datasets: [{
					label: 'Consent Documentation %',
					data: [KPI_BASELINE, finalKPI],
					backgroundColor: ['rgba(255,99,132,0.2)','rgba(75,192,192,0.6)'],
					borderColor: ['rgba(255,99,132,0.8)','rgba(75,192,192,0.9)']
				}]
			},
			options: {
				scales: { y: { min: 70, max: 100 } }
			}
		});
	}

	var msg = '';
	if (finalKPI >= 95) {
		msg = '<div class="success-message">Success — KPI recovered to ' + finalKPI + '%. Accreditation at lower risk.</div>';
	} else {
		msg = '<div class="failure-message">Partial recovery — KPI improved to ' + finalKPI + '%. More work needed.</div>';
	}
	$('#finalResultMessage').html(msg);

	// summary
	var summary = '<h3>Summary</h3>';
	summary += '<p><strong>Player:</strong> ' + (gameState.playerName || '-') + '</p>';
	summary += '<p><strong>Tool used:</strong> ' + (gameState.tool || '-') + '</p>';
	summary += '<p><strong>Actions implemented:</strong> ' + (gameState.actionsSelected.join(', ') || '-') + '</p>';
	summary += '<p><strong>Final KPI:</strong> ' + finalKPI + '%</p>';
	$('#finalSummary').html(summary);

	// small leaderboard stub
	$('#leaderboardContainer').html('<h4>Leaderboard (solo)</h4><table><tr><th>Player</th><th>KPI</th></tr><tr><td>' + (gameState.playerName || '-') + '</td><td>' + finalKPI + '%</td></tr></table>');
}

// helpers
function renderProgressBar() {
	var pct = Math.min(100, Math.round((gameState.score / (weightedMaxPossible || 1)) * 100));
	$('#progressBar').css('width', pct + '%').text(pct + '%');
}

function resetGame() {
	// reset minimal state and go back to registration
	gameState = {
		playerName: '',
		score: 0,
		weightedScore: 0,
		causeWeights: {},
		weightedMax: 0,
		tool: null,
		actionsSelected: [],
		actionsWeighted: 0,
		actionsMaxPossible: 0,
		actionsFactor: 0.5,
		finalKPI: null,
		currentPage: 'Registration'
	};
	clearInterval(countdownTimer);
	goToPage('Registration');
}

// Initialize on load
$(function(){
	goToPage('Registration');
});
</script>
